project_id = "urlaubs-planer"

[api]
enabled = true

[realtime]
enabled = true

[storage.vector]
enabled = false

[functions.start-document-extraction]
verify_jwt = true

[functions.process-document-extractions]
verify_jwt = false

[functions.process-document-storage-cleanups]
verify_jwt = false

[functions.verify-document-upload]
verify_jwt = true

[auth]
enabled = true
site_url = "https://benjaminschn.github.io/urlaubs-planer/"
additional_redirect_urls = ["https://benjaminschn.github.io/urlaubs-planer/"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Keep the email/password provider available for administratively created users.
# Global auth.enable_signup remains false, so public registration stays closed.
enable_signup = true

[auth.rate_limit]
sign_in_sign_ups = 5
token_verifications = 15

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = true
