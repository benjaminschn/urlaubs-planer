project_id = "urlaubs-planer"

[api]
enabled = true

[realtime]
enabled = true

[functions.start-document-extraction]
verify_jwt = true

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173", "http://127.0.0.1:4173"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = true

[auth.sessions]
timebox = "720h"
inactivity_timeout = "24h"
