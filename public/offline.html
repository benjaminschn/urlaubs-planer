<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#143642" />
    <title>Keine Verbindung</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7f8; color: #143642; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 32rem; padding: 2rem; background: #fff; border: 1px solid #cbd5d8; border-radius: 1rem; box-shadow: 0 1rem 3rem rgb(20 54 66 / 10%); }
      h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Der Reiseplaner ist gerade nicht erreichbar. Bitte prüfen Sie Ihre Verbindung und versuchen Sie es erneut.</p>
    </main>
  </body>
</html>
