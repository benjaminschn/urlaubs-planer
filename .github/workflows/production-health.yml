name: Production health

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
      EXTRACTION_WORKER_TOKEN: ${{ secrets.EXTRACTION_WORKER_TOKEN }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: GitHub Pages und Manifest prüfen
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 "$PAGE_URL" >/dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 "${PAGE_URL%/}/manifest.webmanifest" >/dev/null
      - name: Supabase Auth-Gesundheit prüfen
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]; then
            echo "Repository-Variable VITE_SUPABASE_URL fehlt oder ist ungültig." >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            echo "Repository-Variable VITE_SUPABASE_PUBLISHABLE_KEY fehlt oder ist ungültig." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" >/dev/null
      - name: Authentifizierten Extraction-Worker prüfen
        run: |
          if [[ ! "$EXTRACTION_WORKER_TOKEN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "EXTRACTION_WORKER_TOKEN fehlt oder ist ungültig." >&2
            exit 1
          fi
          response="$(curl --fail --silent --show-error --max-time 20 \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/process-document-extractions" \
            -H "Content-Type: application/json" \
            -H "X-Extraction-Worker-Token: ${EXTRACTION_WORKER_TOKEN}" \
            --data '{"health_check":true}')"
          jq -e '.healthy == true' <<<"$response" >/dev/null
      - name: Authentifizierten Dokument-Cleanup-Worker prüfen
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/process-document-storage-cleanups" \
            -H "Content-Type: application/json" \
            -H "X-Extraction-Worker-Token: ${EXTRACTION_WORKER_TOKEN}" \
            --data '{"health_check":true}')"
          if ! jq -e '.worker == "document_storage_cleanup" and .healthy == true' <<<"$response" >/dev/null; then
            echo "Dokument-Cleanup-Worker-Healthcheck war nicht erfolgreich." >&2
            exit 1
          fi
      - name: Jüngste Cron- und pg_net-Ausführung prüfen
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db query --linked --file scripts/check-extraction-worker-schedule.sql
      - name: Document-Cleanup-Queue auf terminale oder veraltete Arbeit prüfen
        run: |
          supabase db query --linked --file scripts/check-document-storage-cleanup-schedule.sql
          supabase db query --linked --file scripts/check-document-storage-cleanup-health.sql
