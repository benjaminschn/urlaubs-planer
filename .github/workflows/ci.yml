name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Lokale Supabase-Testumgebung starten
        run: supabase start
      - name: Migrationen, RLS und Datenbankfunktionen prüfen
        run: supabase test db --local supabase/tests
      - name: Datenbankschema linten
        run: supabase db lint --local --schema public,private --level warning --fail-on warning
      - name: Datenbank-Advisors ausführen
        run: supabase db advisors --local --type all --level warn --fail-on warn
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit- und Accessibility-Tests
        run: npm test
      - name: Production Build mit Pages-Basispfad
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build prüfen
        run: npm run check:build && npm run check:bundle && npm run check:manifest
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Secrets und Source Maps prüfen
        run: npm run check:secrets
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Browser-E2E
        run: npm run test:e2e

  deploy-supabase:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Produktionsprojekt verknüpfen
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migrationen vor dem Frontend ausrollen
        run: supabase db push --linked --yes

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [verify, deploy-supabase]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Production Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
